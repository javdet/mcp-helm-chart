{{- if .Values.aiGateway.upstreamSecret.enabled }}
{{- $apiKey := required "aiGateway.upstreamSecret.apiKey is required when aiGateway.upstreamSecret.enabled is true" .Values.aiGateway.upstreamSecret.apiKey }}
---
# Rendered into data, not stringData, so the Banzai Cloud webhook resolves a vault: reference.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp.aiGatewayUpstreamSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    {{- with .Values.aiGateway.upstreamSecret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $vault := include "mcp.vault" . }}
  {{- if or $vault .Values.aiGateway.upstreamSecret.annotations }}
  annotations:
    {{- with $vault }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with .Values.aiGateway.upstreamSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
data:
  apiKey: {{ $apiKey | b64enc }}
{{- end }}
